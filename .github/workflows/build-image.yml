name: build-image

on:
  push:
    branches: [main]
    paths: ["api/**", "web/**", "Dockerfile", ".dockerignore", ".github/workflows/build-image.yml"]
  pull_request:
    paths: ["api/**", "web/**", "Dockerfile", ".dockerignore"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/homectl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}   # PR on check builds
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de vulnerabilidades
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"   # "1" for blocking pipeline


  # Required secret in the homectl repo: PLATFORM_REPO_TOKEN
  #   fine-grained PAT → repository kubernetes-production → Contents: Read and write
  bump:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moisesjuniorops/kubernetes-production
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
      - name: Bump image tag
        run: |
          TAG="${GITHUB_SHA::7}"
          yq -i ".image.tag = \"$TAG\"" apps/homectl/values-prod.yaml
          git config user.name "homectl-ci"
          git config user.email "homectl-ci@users.noreply.github.com"
          git commit -am "chore(homectl): deploy $TAG" || echo "nothing to change"
          git push      